# シナリオ情報の抽出ルール（既定値）
#
# 文書（txt / md / html / pdf / json）から取り出したテキストを1行ずつ正規化し、
# 「見出し: 値」の形を探して各項目を読み取る。
#   - 正規化: 全角英数字 → 半角、「⼈」→「人」、「︓」「：」→「:」、「〜」「~」「～」→「〜」、
#             日本語の前後の空白を除去、【】→ []
#   - 見出しは行頭か、区切り（空白・/・|・「・」）の直後にあるものを探す。
#     1行に複数の見出しがあれば（「PL人数:2人 / 所要時間:3時間」）、それぞれ読み取る。
#   - 「[推奨技能]」のように見出しだけの行は、次の行を値とする。
#   - 同じ項目が何度も出てくる場合は、優先度の高い文書の、最初に出てきたものを採る。
#
# このファイルを編集すれば、再ビルドせずに見出しの言い換えやシステム名を追加できる。

version = 1

# ---------------------------------------------------------------------------
# 項目ごとの見出し語（大文字小文字は区別しない。長いものから順に照合する）
# ---------------------------------------------------------------------------
[labels]
# 題名の見出し。「タイトル：「あやかし夜行奇譚」」のように書かれていれば、括弧の中を題名とする。
# 見つかれば、文字の大きさなどから推測した題名より優先する（ほかの文書で推測した題名よりも）。
title = ["タイトル", "シナリオ名", "シナリオタイトル", "作品名", "作品タイトル", "題名", "商品名", "title", "scenario title"]
system = ["使用システム", "対応システム", "TRPGシステム", "ゲームシステム", "システム", "使用ルール", "system", "game system"]
players = [
  "PL人数", "PLの人数", "推奨人数", "プレイ人数", "プレイヤー人数", "参加人数", "推奨PL人数", "推奨プレイ人数", "人数",
  "players", "player count", "player_count", "num_players", "number of players",
]
duration = [
  "所要時間", "プレイ時間", "想定時間", "推奨時間", "想定プレイ時間", "セッション時間", "目安時間", "目安プレイ時間", "時間",
  "play time", "playtime", "play_time", "duration", "session length",
]
genre = ["ジャンル", "シナリオタイプ", "シナリオジャンル", "シナリオ形式", "タイプ", "genre", "type"]
lost = ["ロスト率", "ロスト", "キャラロスト", "lost", "lost rate"]
# 「推奨：目星、聞き耳」のような短い書き方も読む（「推奨人数：」とは「推奨」の直後が「：」かどうかで区別する）
skills = ["推奨技能", "必須技能", "推奨スキル", "必要技能", "推奨", "あると良い技能", "recommended skills", "skills"]
format = ["セッション形式", "プレイ形式", "開催形式", "推奨形式", "形式", "session", "format"]
# あらすじの見出し。見出しの次の行から、次の見出しの手前までをあらすじとする。
# 複数あるときは、次の順に優先する（同じ順位なら先に出てきたもの）。
#   1. 「あらすじ」「ストーリー」など
#   2. 「概要」を含む見出し（人数などの仕様が書かれた欄はあらすじにしない。文章だけの欄に限る）
#   3. 「背景」を含む見出し
#   4. 「導入」「イントロ」（GM 向けの進行の説明が多いので最後）
summary = [
  "あらすじ", "シナリオのあらすじ", "ものがたり", "物語", "ストーリー", "story", "synopsis",
  "トレーラー", "trailer",
  "概要", "シナリオ概要", "シナリオの概要",
  "背景", "シナリオ背景", "事件の背景", "background",
  "イントロダクション", "イントロ", "導入", "introduction",
]
# ---------------------------------------------------------------------------
# システム名の正規化（上から順に照合し、最初に一致したものを採る。
# 版の違いを先に判定するため、「新クトゥルフ」を「クトゥルフ」より前に置く）
# ---------------------------------------------------------------------------
[[system]]
name = "新クトゥルフ神話TRPG"
match = ["新クトゥルフ", "CoC7", "CoC 7", "CoC第7版", "クトゥルフ神話TRPG第7版", "7版", "第7版", "7th"]

[[system]]
name = "クトゥルフ神話TRPG"
match = ["CoC6", "CoC 6", "6版", "第6版", "クトゥルフ神話TRPG", "クトゥルフ", "CoC", "Call of Cthulhu"]

[[system]]
name = "エモクロアTRPG"
match = ["エモクロア", "emoklore"]

[[system]]
name = "インセイン"
match = ["インセイン", "insane"]

[[system]]
name = "シノビガミ"
match = ["シノビガミ", "shinobigami"]

[[system]]
name = "マーダーミステリー"
match = ["マーダーミステリー", "マダミス", "murder mystery"]

[[system]]
name = "ダブルクロス The 3rd Edition"
match = ["ダブルクロス", "DX3", "double cross"]

[[system]]
name = "ソード・ワールド2.5"
match = ["ソードワールド2.5", "ソード・ワールド2.5", "SW2.5"]

[[system]]
name = "ソード・ワールド2.0"
match = ["ソードワールド2.0", "ソード・ワールド2.0", "SW2.0"]

[[system]]
name = "永い後日談のネクロニカ"
match = ["ネクロニカ"]

[[system]]
name = "マギカロギア"
match = ["マギカロギア"]

[[system]]
name = "ストリテラ"
match = ["ストリテラ"]

[[system]]
name = "パラノイア"
match = ["パラノイア", "paranoia"]

[[system]]
name = "ダンジョンズ&ドラゴンズ"
match = ["ダンジョンズ&ドラゴンズ", "D&D", "DnD"]

[[system]]
name = "サタスペ"
match = ["サタスペ"]

[[system]]
name = "アリアンロッドRPG"
match = ["アリアンロッド"]

# ---------------------------------------------------------------------------
# ロストの値の正規化（上から順に照合）
# 英数字の語は単語として照合する（"no" は "none" や "normal" には一致しない）。日本語は部分一致。
# ---------------------------------------------------------------------------
[[lost]]
level = "none"
match = ["なし", "無し", "無", "確定生還", "none", "no"]

[[lost]]
level = "low"
match = ["低", "少", "少ない", "low"]

[[lost]]
level = "medium"
match = ["中", "普通", "そこそこ", "medium"]

[[lost]]
level = "high"
match = ["高", "多", "high"]

[[lost]]
level = "yes"
match = ["あり", "有り", "有", "ある", "可能性", "yes"]

# ---------------------------------------------------------------------------
# セッション形式（形式・時間などの値から読み取る）
# ---------------------------------------------------------------------------
[[format]]
key = "voice"
match = ["ボイセ", "ボイスセッション", "ボイス", "通話", "voice"]

[[format]]
key = "text"
match = ["テキセ", "テキストセッション", "テキスト", "text"]

[[format]]
key = "offline"
match = ["オフセ", "オフライン", "対面", "offline"]

[[format]]
key = "online"
match = ["オンセ", "オンライン", "online"]

# ---------------------------------------------------------------------------
# 読む文書の選び方
# ---------------------------------------------------------------------------
[documents]
# 一度に読む文書の数の上限
max_documents = 8
# 1つの文書のうち、項目を探す行数（概要は冒頭にあることが多い。後半の秘匿情報を拾わないように）
max_lines_per_document = 400

# 文書の優先度。名前に含まれる語で加点・減点する（表紙判定と同じく単語・部分一致で照合）。
prefer = [
  "scenario", "シナリオ", "概要", "情報", "readme", "はじめに", "お読み", "ルールブック", "rulebook", "rule",
  "info", "トレーラー", "trailer", "公開", "テキスト", "本文", "guide", "ガイド", "gm",
]
lower = ["更新", "changelog", "bgm", "license", "規約", "credit", "クレジット", "アンケート", "同梱"]

# 読まない文書（ネタバレと、プレイヤーごとの秘匿情報）。ファイル名・フォルダ名に含まれていたら読まない。
# ハンドアウトは他のプレイヤーに秘密の情報で、HOごとの推奨技能などを全体の値と取り違えやすいので読まない。
# （ZIP 全体を包むルートフォルダの名前は照合に使わない。題名に「真相」などが入っていても読める）
spoiler = [
  "ネタバレ", "spoiler", "spoilers", "netabare", "解説", "commentary", "エンディング", "ending", "endings", "ed",
  "エピローグ", "epilogue", "秘匿", "真相", "あとがき", "後書き", "afterword",
  "ハンドアウト", "handout", "handouts", "ho",
]

# 文書の途中にこの「境界」があれば、そこから先は読まない（「以下ネタバレ」など）。
# 行に boundary_word のどれかが含まれていて、次のどちらかなら境界とみなす。
#   - boundary_marker のどれかも含まれている（例: 「以下ネタバレ」「ここから先はKPのみ閲覧してください」）
#   - 行が boundary_short_line 文字以下で、boundary_heading のどれかも含まれている
#     （見出しの行。例: 「シナリオ本編ネタバレ有」「KP向け情報」「【ネタバレ注意】」）
# ただし boundary_negation のどれかを含む行（「ネタバレは含まれません」など）は境界にしない。
boundary_word = ["ネタバレ", "spoiler", "spoilers", "KPのみ", "GMのみ", "KP専用", "GM専用", "KP向け", "KP情報"]
boundary_marker = ["以下", "以降", "以後", "これより", "ここから", "この先", "この後", "次ページ", "次のページ", "below", "from here", "next page"]
boundary_heading = ["有", "あり", "含む", "含みます", "注意", "情報", "本編", "閲覧"]
boundary_short_line = 40
boundary_negation = [
  "なし", "無し", "含みません", "含まない", "含まれません", "含まれない", "含まれていません",
  "ネタバレはありません", "ネタバレありません", "ネタバレ無",
  "no spoiler", "spoiler-free", "spoiler free", "non-spoiler",
]
